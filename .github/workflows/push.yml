name: Keboola Component Build & Deploy Pipeline
on:
  push:
    branches-ignore:
      - main
    tags:
      - "*"

concurrency: ci-${{ github.ref }}

jobs:
  ci:
    uses: keboola/component-ci/.github/workflows/component-pipeline.yml@master
    with:
      app_id: keboola.wr-oracle-ebs
      vendor: keboola
      test_build_target: test
      docker_build_target: production
      # Push README/description/URL changes to Developer Portal on every commit,
      # even before ECR push is fully configured.
      update_properties: true
    secrets: inherit
