name: Keboola Component Build & Deploy Pipeline
on:
  push:
    branches-ignore:
      - main
    tags:
      - "*"

concurrency: ci-${{ github.ref }}

jobs:
  ci:
    # One-off deploy to seed ECR with the 0.0.1 image so Developer Portal picks
    # up the component for the first time. Pinned to the component-ci PR #7
    # branch (feature/deploy-ready-override) which introduces the `deploy_ready`
    # input. Revert this branch + ref to @master after the first successful run.
    uses: keboola/component-ci/.github/workflows/component-pipeline.yml@feature/deploy-ready-override
    with:
      app_id: keboola.wr-oracle-ebs
      vendor: keboola
      test_build_target: test
      docker_build_target: production
      deploy_ready: true
      tag: "0.0.1"
    secrets: inherit
