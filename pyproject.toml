[project]
name = "wr-oracle-ebs"
dynamic = ["version"]
readme = "README.md"
requires-python = "~=3.13"
dependencies = [
    "keboola-component>=1.9.0",
    "keboola-utils>=1.1.0",
    "oracledb>=2.5.0",
    "pydantic>=2.11.7",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.1",
    "keboola-datadirtest>=0.0.0",
    "keboola-vcr>=0.0.0",
    "mock>=5.2.0",
    "pre-commit>=4.5.0",
    "pytest>=9.0.2",
    "ruff>=0.15.2",
]

[tool.uv.sources]
keboola-datadirtest = { git = "https://github.com/keboola/datadirtest.git", rev = "82f0c083263ffba193dd304439243de55b3f70a9" }
keboola-vcr = { git = "https://github.com/keboola/python-vcr-tests.git", rev = "aaa70504db8e6c687530868633f4a0135b717496" }

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I", "UP"]
